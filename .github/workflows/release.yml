# On a version tag (v0.4.0): check the manifest version and vendored files, build the zip, draft a GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches manifest version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
      - name: Vendored libraries unchanged
        run: cd extension/lib && sha256sum -c VERSIONS.sha256
      - name: Build zip
        run: node scripts/package.mjs
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/inpage-*.zip --draft --generate-notes --title "inpage $GITHUB_REF_NAME"
