# Fast checks on every push and pull request: every script parses, manifest and package versions match, the manifest
# names only files that exist, vendored libraries match their checksums. The end-to-end tests need a key, so they run locally.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checks
        run: npm run check
