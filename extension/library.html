<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inpage notes</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="lib/katex/katex.min.css">
<style>
  :root { --bg:#ffffff; --bg2:#fafafa; --surface:#f4f4f5; --text:#111114; --text2:#3f3f46; --muted:#71717a; --border:#e7e7ea; --accent:#6d45c7; --accent2:#5a36ad; --soft:#f3effc; --ink:#fff; --bad:#c2410c; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17171b; --bg2:#1c1c21; --surface:#26262c; --text:#f4f4f5; --text2:#d4d4d8; --muted:#a1a1aa; --border:#2e2e35; --accent:#a78bfa; --accent2:#c4b5fd; --soft:rgba(167,139,250,.14); --ink:#17171a; --bad:#fb923c; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font:14px/1.55 "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--border); flex:none; }
  header h1 { margin:0; font-size:15px; font-weight:700; letter-spacing:-.01em; display:flex; gap:9px; align-items:center; white-space:nowrap; }
  header h1 span { color:var(--muted); font-weight:500; }
  .search { flex:1; max-width:520px; margin-left:12px; position:relative; }
  .search input { width:100%; padding:8px 12px 8px 32px; border:1px solid var(--border); border-radius:10px; background:var(--bg2); color:var(--text); font:inherit; outline:0; }
  .search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--soft); }
  .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .spacer { flex:1; }
  button { font:inherit; cursor:pointer; }
  .btn { border:1px solid var(--border); background:var(--bg); color:var(--text2); padding:6px 11px; border-radius:9px; font-size:13px; white-space:nowrap; }
  .btn:hover { border-color:var(--muted); color:var(--text); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--ink); } .btn.primary:hover { background:var(--accent2); }
  .btn.danger:hover { border-color:var(--bad); color:var(--bad); }
  .menu { position:relative; }
  .menu .pop { position:absolute; right:0; top:calc(100% + 6px); background:var(--bg); border:1px solid var(--border); border-radius:12px; box-shadow:0 14px 34px -14px rgba(0,0,0,.3); padding:5px; min-width:230px; z-index:5; }
  .menu .pop button { display:block; width:100%; text-align:left; border:0; background:none; color:var(--text); padding:8px 10px; border-radius:8px; font-size:13px; }
  .menu .pop button:hover { background:var(--surface); }
  .menu .pop small { display:block; color:var(--muted); font-size:12px; }
  main { flex:1; display:grid; grid-template-columns:minmax(260px, 340px) 1fr; min-height:0; }
  .list { border-right:1px solid var(--border); overflow:auto; padding:8px; }
  .item { display:block; width:100%; text-align:left; border:0; background:none; color:inherit; padding:10px 12px; border-radius:10px; }
  .item:hover { background:var(--surface); }
  .item[aria-current=true] { background:var(--soft); }
  .item .t { font-weight:600; font-size:13.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .item .s { font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; }
  .item .hit { font-size:12px; color:var(--text2); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  mark { background:color-mix(in srgb, var(--accent) 22%, transparent); color:inherit; border-radius:3px; padding:0 1px; }
  .detail { overflow:auto; padding:28px clamp(20px, 5vw, 56px) 60px; }
  .detail .inner { max-width:760px; }
  .dh h2 { margin:0 0 4px; font-size:22px; letter-spacing:-.015em; line-height:1.25; }
  .dh .url { color:var(--muted); font-size:13px; word-break:break-all; }
  .dh .url a { color:inherit; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px; }
  h3 { font-size:11.5px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:30px 0 10px; }
  .card { border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .quote { font-size:13px; color:var(--text2); background:var(--soft); border-radius:10px; padding:8px 12px; margin-bottom:10px; }
  .quote img { display:block; max-width:100%; max-height:180px; border-radius:8px; background:#fff; }
  .q { font-weight:600; margin:10px 0 4px; }
  .a { color:var(--text); }
  .a p { margin:.45em 0; } .a > :first-child { margin-top:0; } .a ul, .a ol { padding-left:1.3em; margin:.4em 0; }
  .a code { background:var(--surface); padding:1px 5px; border-radius:5px; font-size:12.5px; }
  .a pre { background:var(--surface); padding:10px; border-radius:8px; overflow:auto; } .a pre code { padding:0; }
  .a table { border-collapse:collapse; font-size:13px; } .a td, .a th { border:1px solid var(--border); padding:4px 8px; }
  .a .katex-display { overflow-x:auto; overflow-y:hidden; }
  .a a, .src a { color:var(--accent); }
  .src { font-size:12px; color:var(--muted); margin-top:6px; }
  .err { color:var(--bad); }
  .edit { display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--border); }
  .edit:first-of-type { border-top:0; }
  .edit .k { flex:none; width:24px; height:24px; border-radius:7px; display:grid; place-items:center; background:var(--soft); color:var(--accent); font-size:12px; font-weight:700; }
  .edit .i { font-weight:600; }
  .edit.gl { align-items:flex-start; } .edit.gl .btn { flex:none; padding:4px 9px; font-size:12px; }
  .item.gloss { border:1px dashed var(--border); margin-bottom:6px; }
  .edit .k.v-supported { background:rgba(22,163,74,.14); color:#16a34a; } .edit .k.v-disputed { background:rgba(220,38,38,.12); color:#dc2626; } .edit .k.v-unclear { background:rgba(217,119,6,.14); color:#d97706; }
  .edit .o a { color:var(--accent); } .edit .o { font-size:13px; color:var(--muted); margin-top:2px; }
  .nothing { color:var(--muted); padding:40px 0; text-align:center; }
  .empty { max-width:440px; margin:12vh auto 0; text-align:center; color:var(--muted); }
  .empty h2 { color:var(--text); font-size:18px; margin-bottom:6px; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#17171b; color:#f4f4f5; padding:9px 14px; border-radius:10px; font-size:13px; box-shadow:0 12px 30px -10px rgba(0,0,0,.5); }
  @media (max-width: 760px) { main { grid-template-columns:1fr; } .list { border-right:0; border-bottom:1px solid var(--border); max-height:38vh; } header { flex-wrap:wrap; } .search { order:3; flex-basis:100%; margin:4px 0 0; max-width:none; } }
</style>
</head>
<body>
<header>
  <h1><img src="icons/icon-32.png" width="22" height="22" alt="">inpage <span>notes</span></h1>
  <label class="search"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2l3.8 3.8"/></svg><input id="q" type="search" placeholder="Search questions, answers, pages…" aria-label="Search your notes"></label>
  <span class="spacer"></span>
  <div class="menu"><button class="btn" id="exportBtn" aria-haspopup="true" aria-expanded="false">Export…</button>
    <div class="pop" id="exportPop" hidden>
      <button data-x="md">All notes as Markdown<small>One .md file, a section per page (Obsidian-friendly)</small></button>
      <button data-x="json">Backup (JSON)<small>Every page's notes and your actions, to restore later</small></button>
      <button data-x="restore">Restore a backup…<small>Adds pages from a backup; newer notes win</small></button>
    </div>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
  </div>
</header>
<main>
  <nav class="list" id="list" aria-label="Pages with notes"></nav>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>
<div id="toast" hidden></div>
<script src="lib/purify.min.js"></script>
<script src="lib/marked.min.js"></script>
<script src="lib/katex/katex.min.js"></script>
<script src="src/render.js"></script>
<script src="presets.js"></script>
<script src="notes-md.js"></script>
<script src="library.js"></script>
</body>
</html>
