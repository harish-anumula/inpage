<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lecture 3 (YouTube-style captions) - VideoSite</title>
<style>body{font:16px system-ui,sans-serif;margin:0;background:#0f0f0f;color:#eee}#movie_player{position:relative;width:960px;height:540px;margin:24px auto;background:#000}#movie_player video{width:100%;height:100%}.ytp-caption-window-container{position:absolute;left:0;right:0;bottom:40px;text-align:center;pointer-events:none}.ytp-caption-segment{background:rgba(0,0,0,.75);color:#fff;font-size:22px;padding:2px 6px}.cover{position:absolute;inset:0}</style></head>
<body>
<div id="movie_player"><video muted playsinline preload="auto" src="lecture.webm"></video><div class="cover"></div><div class="ytp-caption-window-container"></div></div>
<p style="width:960px;margin:0 auto">A page that shows captions the way YouTube does (live caption segments, no text track), with an overlay over the video like YouTube's.</p>
<script>
// Render captions like YouTube: only the current line, as .ytp-caption-segment, changing as the video plays.
fetch('lecture.vtt').then(r => r.text()).then(vtt => {
  const cues = [...vtt.matchAll(/(\d\d):(\d\d)\.(\d+) --> (\d\d):(\d\d)\.(\d+)\n(.+)/g)].map(m => ({ s: +m[1] * 60 + +m[2], e: +m[4] * 60 + +m[5], t: m[7] }));
  const v = document.querySelector('video'), box = document.querySelector('.ytp-caption-window-container');
  let shown = '';
  setInterval(() => { const c = cues.find(c => v.currentTime >= c.s && v.currentTime < c.e); const t = c ? c.t : ''; if (t !== shown) { shown = t; box.innerHTML = t ? `<span class="ytp-caption-segment"></span>` : ''; if (t) box.firstChild.textContent = t; } }, 200);
});
</script>
</body>
</html>
